<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>X | Timeline</title>
<!-- Sentry SDK -->
<script src="https://js.sentry-cdn.com/e6cfc1925db7c9bd2192efe5c70626a3.min.js" crossorigin="anonymous"></script>
<script>
  Sentry.onLoad(function() {
    Sentry.init({
      dsn: 'https://e6cfc1925db7c9bd2192efe5c70626a3.ingest.sentry.io/4507097023295488',
      integrations: [new Sentry.BrowserTracing(), new Sentry.Replay()],
      tracesSampleRate: 1.0,
      replaysSessionSampleRate: 0.1,
      replaysOnErrorSampleRate: 1.0,
    });
  });
</script>
</head>
<body>
  <h1>Welcome to X</h1>
  <button id="logoutBtn">Logout</button>
  <a href="profile.html">Go to My Profile</a>

  <h2>Create a Post</h2>
  <textarea id="postContent" rows="3" cols="40" placeholder="Write something..."></textarea><br>
  <button id="postBtn">Post</button>

  <h2>Timeline (My Posts)</h2>
  <ul id="timeline"></ul>

  <div id="feature-container"></div>

  <script type="module">
    import { auth, db } from './script/firebase.js';
    import {
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      collection,
      query,
      where,
      orderBy,
      addDoc,
      getDocs,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const postContent = document.getElementById('postContent');
    const postBtn = document.getElementById('postBtn');
    const timeline = document.getElementById('timeline');
    const logoutBtn = document.getElementById('logoutBtn');

    let currentUser;

    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user;
        loadPosts();
      } else {
        window.location.href = 'login.html';
      }
    });

    postBtn.onclick = async () => {
      const content = postContent.value.trim();
      if (content === '') return;

      await addDoc(collection(db, 'posts'), {
        uid: currentUser.uid,
        content,
        createdAt: new Date()
      });

      postContent.value = '';
      loadPosts();
    };

    async function loadPosts() {
      timeline.innerHTML = '';
      const q = query(
        collection(db, 'posts'),
        where('uid', '==', currentUser.uid),
        orderBy('createdAt', 'desc')
      );
      const querySnapshot = await getDocs(q);
      for (const docSnap of querySnapshot.docs) {
        const data = docSnap.data();
        const postId = docSnap.id;

        // Verificar si el usuario ya dio like
        const likeRef = collection(db, 'posts', postId, 'likes');
        const likeQuery = query(likeRef, where('uid', '==', currentUser.uid));
        const likeSnapshot = await getDocs(likeQuery);
        const hasLiked = !likeSnapshot.empty;

        // Contar likes
        const totalLikes = (await getDocs(likeRef)).size;

        // Cargar respuestas
        const replyRef = collection(db, 'posts', postId, 'replies');
        const replySnapshot = await getDocs(query(replyRef, orderBy('createdAt', 'asc')));
        let repliesHtml = '';
        replySnapshot.forEach(replyDoc => {
          const replyData = replyDoc.data();
          repliesHtml += `<p><strong>${replyData.uid}</strong>: ${replyData.content}</p>`;
        });

        const li = document.createElement('li');
        li.innerHTML = `
          <p>${data.content}</p>
          <p>Likes: ${totalLikes}</p>
          <button onclick="likePost('${postId}')" ${hasLiked ? 'disabled' : ''}>
            ${hasLiked ? 'Liked' : 'Like'}
          </button>
          <button onclick="deletePost('${postId}')">Delete</button>
          <h3>Replies</h3>
          ${repliesHtml}
          <textarea id="replyContent-${postId}" placeholder="Write a reply..."></textarea><br>
          <button onclick="replyToPost('${postId}')">Reply</button>
        `;
        timeline.appendChild(li);
      }
    }

    window.likePost = async (postId) => {
      const likeRef = collection(db, 'posts', postId, 'likes');
      await addDoc(likeRef, { uid: currentUser.uid });
      loadPosts();
    };

    window.replyToPost = async (postId) => {
      const replyContent = document.getElementById(`replyContent-${postId}`).value.trim();
      if (!replyContent) return;

      await addDoc(collection(db, 'posts', postId, 'replies'), {
        content: replyContent,
        uid: currentUser.uid,
        createdAt: new Date()
      });

      loadPosts();
    };

    window.deletePost = async (postId) => {
      await deleteDoc(doc(db, 'posts', postId));
      loadPosts();
    };

    logoutBtn.onclick = async () => {
      await signOut(auth);
      window.location.href = 'login.html';
    };
  </script>
</body>
  <!-- Contenedor del botón o link según el feature flag -->
  <div id="feature-container"></div>
  <!-- Carga de scripts -->
  <script type="module" src="./main.js"></script>
</body>
</html>
